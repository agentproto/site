name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Lint + type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Paper & Phosphor brand tokens are an identical copy in both
      # site repos (no shared package yet — the sites build standalone
      # in Docker). Fail fast when this copy drifts from the sibling.
      # Coordinated changes: open the sibling PR from the SAME branch
      # name — the check prefers that branch over main. On main pushes
      # the check is warning-only (the sibling may merge seconds later).
      - name: Brand tokens in sync with cli-site
        run: |
          BRANCH="${{ github.head_ref }}"
          URL_BASE="https://raw.githubusercontent.com/agentproto/cli-site"
          if [ -n "$BRANCH" ] && curl -fsSL "$URL_BASE/$BRANCH/src/app/brand.css" -o /tmp/sibling-brand.css; then
            echo "comparing against cli-site@$BRANCH"
          elif curl -fsSL "$URL_BASE/main/src/app/brand.css" -o /tmp/sibling-brand.css; then
            echo "comparing against cli-site@main"
          else
            echo "sibling brand.css not found — skipping"; exit 0
          fi
          if ! diff -u /tmp/sibling-brand.css src/app/brand.css; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::brand.css drifted from cli-site (sibling merge may be in flight)"
            else
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # A standalone pnpm-lock.yaml is now committed (sites-fix,
      # 2026-10-02) — frozen install so a floating transitive dependency
      # can't silently break the build again the way an unpinned
      # mdast-util-to-markdown release did.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint ran on nothing for months: `next lint` was removed in Next 16
      # and no eslint config existed, so `pnpm lint` just errored and no
      # workflow called it. Wired in here so it cannot rot silently again.
      # Source-only — needs no content sync.
      - name: Lint
        run: pnpm lint

      # `prebuild` runs `scripts/sync-content.mjs` which clones
      # github.com/agentproto/agentproto into .cache/ at depth 1.
      # Public repo — no auth needed.
      - name: Type-check
        run: pnpm typecheck

      - name: Build (with content sync)
        run: pnpm build
